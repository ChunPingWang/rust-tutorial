[package]
name = "sol-ml03"
version = "0.1.0"
edition = "2021"

[dependencies]
# 版本跟著 linfa 0.8（ML-3 會用）走：ndarray 0.16、rand 0.8，避免同一個專案裡出現兩個 ndarray
ndarray = "0.16"
rand = "0.8"
rand_distr = "0.4"
# linfa：Rust 的 scikit-learn。核心 crate + 各演算法 crate
linfa = "0.8"
linfa-logistic = "0.8"
linfa-clustering = "0.8"
linfa-preprocessing = "0.8"
# 練習 3、4
linfa-trees = "0.8"
linfa-reduction = "0.8"
