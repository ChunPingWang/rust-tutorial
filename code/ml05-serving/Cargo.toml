[package]
name = "ml05-serving"
version = "0.1.0"
edition = "2021"

[dependencies]
candle-core = "0.11"
candle-nn = "0.11"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync"] }
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = "0.4"
# 只有 bench 子命令用來產生測試交易
rand = "0.8"
rand_distr = "0.4"
