[package]
name = "ml04-candle"
version = "0.1.0"
edition = "2021"

[dependencies]
ndarray = "0.16"
rand = "0.8"
rand_distr = "0.4"
# candle：Hugging Face 的深度學習框架。core 是 Tensor 與自動微分，nn 是層、損失、優化器
candle-core = "0.11"
candle-nn = "0.11"
# 存 Scaler 參數用
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
